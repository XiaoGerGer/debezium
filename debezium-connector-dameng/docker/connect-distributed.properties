# Example settings for a single Kafka Connect worker in a test network.
# Mount a deployment-specific worker.properties file for other broker addresses,
# security settings, or a multi-broker Connect cluster.
bootstrap.servers=kafka:9092
group.id=dameng-connect
config.storage.topic=dameng-connect-configs
offset.storage.topic=dameng-connect-offsets
status.storage.topic=dameng-connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
listeners=http://0.0.0.0:8083
plugin.path=/opt/kafka/plugins
plugin.discovery=service_load
